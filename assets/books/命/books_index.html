    body {

    h1 {
      text-align: center;

    .shelf {
      display: flex;

    .book {
      position: relative;
      width: 120px;
      height: 180px;
      border-radius: 6px;
      box-shadow: 2px 4px 6px rgba(0,0,0,0.3);
      display: flex;
      justify-content: right;
      align-items: baseline;
      transition: transform 0.18s;
      background: #34495e;
      text-decoration: none;
    }
    .book:hover {
      transform: translateY(-6px);
      cursor: pointer;
    }
    /* 书脊 + 装订线 */
    .book::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 15px;
      background: rgba(0,0,0,0.28);
      border-right: 2px solid rgba(0,0,0,0.6);
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 28px,
        rgba(255,255,255,0.35) 28px,
        rgba(255,255,255,0.35) 30px
      );
    }
    .label {
      writing-mode: vertical-rl;
      background: #fdfdfd;
      color: #000;
      padding: 6px 4px;
      border: 3px double #333;
      border-radius: 2px;
      font-size: 16px;
      text-align: center;
      z-index: 1;
      position: relative;
      max-height: calc(100% - 12px);
      overflow: hidden;
      right: 15px;
      top: 15px;
    }
    @media (max-width: 600px) {
      .book { width: 90px; height: 140px; }
      .label { font-size: 12px; }
    }
