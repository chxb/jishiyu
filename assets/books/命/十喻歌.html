<h1 id="十喻歌">十喻歌</h1>
<p>吉凶最要细分明，本对合邻有重轻</p>
<p>注：说明本对合邻是有不同的轻重力量。</p>
<p>四面楚歌终必败，千祥云集自然亨</p>
<p>注：三方四正的整体吉凶才是最要紧。</p>
<p>自强才是好人家，邻舍惟添锦上花，</p>
<p>注：本宫的吉凶很最重要，邻宫只是辅助性质锦上添花。</p>
<p>若到逢源真境地，春风只可感相差</p>
<p>注：逢源者会合宫也，会合宫的力量不能忽视。</p>
<p>两邻相侮岂为灾，自伐才叫大可哀</p>
<p>注：此两句反喻本方吉，邻宫虽凶亦不为侮。</p>
<p>易躲当头一棒棍，难逃左右袭兵来</p>
<p>注：对宫凶有时也可避，左右袭击便难防。</p>
