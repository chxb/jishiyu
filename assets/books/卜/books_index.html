        transparent 0px,
        transparent 28px,

    }
    .label {
      writing-mode: vertical-rl;
      background: #fdfdfd;
      color: #000;
      padding: 6px 4px;
      border: 3px double #333;
      border-radius: 2px;
      font-size: 16px;
      text-align: center;
      z-index: 1;
      position: relative;
      max-height: calc(100% - 12px);
      overflow: hidden;
      right: 15px;
      top: 15px;
    }
    @media (max-width: 600px) {
